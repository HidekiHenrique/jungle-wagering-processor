name: jungle-wagering

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # SQS emulator. MiniStack instead of LocalStack: since 2026 the LocalStack
  # image requires an account auth token (see ARCHITECTURE.md).
  sqs:
    image: ministackorg/ministack:1.5.38
    ports:
      - "${SQS_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot job: creates the FIFO queues and the DLQ redrive policy.
  sqs-init:
    image: amazon/aws-cli:2.39.4
    depends_on:
      sqs:
        condition: service_healthy
    environment:
      SQS_ENDPOINT: http://sqs:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      SQS_VISIBILITY_TIMEOUT: ${SQS_VISIBILITY_TIMEOUT:-30}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
    volumes:
      - ./docker/sqs/create-queues.sh:/create-queues.sh:ro
    entrypoint: ["/bin/sh", "/create-queues.sh"]
    restart: "no"

volumes:
  postgres-data:
